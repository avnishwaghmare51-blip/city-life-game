<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CITY LIFE 3D - FREE CAM</title>
<style>
body{margin:0;overflow:hidden;background:black;color:white;font-family:Arial; touch-action:none}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);padding:10px;border-radius:10px;z-index:10;font-size:14px}
#topBtns{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:8px}
.topBtn{background:#ff0000;color:white;border:2px solid white;padding:10px 12px;border-radius:20px;font-weight:bold;font-size:14px}
.topBtn.active{background:#00cc00}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:20}
.btn{width:70px;height:70px;background:rgba(255,255,255,0.3);border:2px solid white;border-radius:50%;color:white;font-size:30px;display:flex;align-items:center;justify-content:center;user-select:none}
.btn:active{background:rgba(255,0,0,0.6)}
#rightSide{display:flex;gap:10px}
#hint{position:absolute;bottom:110px;left:0;right:0;text-align:center;font-size:13px;background:rgba(0,0,0,0.5);padding:5px;z-index:15}
</style>
</head>
<body>
<div id="ui">
<h2 style="margin:0">🚔 CITY LIFE 3D</h2>
<p style="margin:5px 0">Coins: <span id="score">0</span> / 8 | Time: <span id="time">90</span>s</p>
<p id="msg" style="margin:0">Free Cam ON karke city ghumo!</p>
</div>
<div id="topBtns">
<button class="topBtn" id="camBtn">📷 FREE CAM</button>
<button class="topBtn" id="resetBtn" style="background:#333">🔄 Reset</button>
</div>
<div id="hint">👆 Free Cam me screen drag karke camera ghumao</div>
<div id="controls">
<div style="display:flex;gap:10px">
<div class="btn" id="leftBtn">⬅️</div>
<div class="btn" id="rightBtn">➡️</div>
</div>
<div id="rightSide">
<div class="btn" id="downBtn">⬇️</div>
<div class="btn" id="upBtn" style="background:rgba(255,0,0,0.5)">⬆️</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
let light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10,20,10); scene.add(light);
let ground = new THREE.Mesh(new THREE.PlaneGeometry(160,160), new THREE.MeshLambertMaterial({color:0x3a9a3a}));
ground.rotation.x = -Math.PI/2; scene.add(ground);
let roadMat = new THREE.MeshLambertMaterial({color:0x333333});
[[160,12,0,0],[12,160,0,0],[160,12,0,-30],[12,160,30,0]].forEach(r=>{
  let road = new THREE.Mesh(new THREE.PlaneGeometry(r[0],r[1]), roadMat);
  road.rotation.x=-Math.PI/2; road.position.set(r[2],0.1,r[3]); scene.add(road);
});
let cols=[0xffcc00,0xff5555,0x55aaff,0xaa55ff,0xff8800,0x00cc88,0xff00aa,0x00cccc,0xffff00,0x55ff55];
for(let i=0;i<12;i++){
  let h=6+Math.random()*10;
  let x = [-50,-30,-15,15,30,50][i%6];
  let z = [-50,-30,30,50][Math.floor(i/3)%4];
  let b=new THREE.Mesh(new THREE.BoxGeometry(9,h,9), new THREE.MeshLambertMaterial({color:cols[i%10]}));
  b.position.set(x,h/2,z); scene.add(b);
}
function makeCar(color, cabinColor){
  let g = new THREE.Group();
  let body = new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4), new THREE.MeshLambertMaterial({color}));
  body.position.y=0.6; g.add(body);
  let cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.7,2), new THREE.MeshLambertMaterial({color:cabinColor}));
  cabin.position.y=1.3; g.add(cabin);
  return g;
}
let car = makeCar(0xff0000, 0x222222); car.position.set(0,0,20); scene.add(car);
let police1 = makeCar(0xffffff, 0x0000ff); police1.position.set(-15,0,-20); scene.add(police1);
let police2 = makeCar(0xffffff, 0x0000ff); police2.position.set(15,0,-20); scene.add(police2);
let traffics=[];
[[0xffcc00,-20,0],[0x00ff00,20,10],[0xffcc00,0,-30],[0x00ff00,-25,25]].forEach(t=>{
  let tc = makeCar(t[0], 0x111111); tc.position.set(t[1],0,t[2]); scene.add(tc);
  traffics.push({car:tc, dir: Math.random()>0.5?1:-1, speed:0.1+Math.random()*0.15});
});
let coins=[]; let coinGeo=new THREE.CylinderGeometry(0.9,0.9,0.3,20);
let coinMat=new THREE.MeshLambertMaterial({color:0xffd700});
[[-10,0],[10,10],[-15,-10],[15,-15],[0,0],[-25,15],[25,-25],[0,-25]].forEach(p=>{
  let c=new THREE.Mesh(coinGeo,coinMat); c.rotation.x=Math.PI/2; c.position.set(p[0],1,p[1]); scene.add(c); coins.push(c);
});
let keys={}, score=0, timeLeft=90, gameOver=false, speed=0, angle=0;
let freeCam=false, camYaw=0, camPitch=0.4, camDist=18, camTarget=new THREE.Vector3(0,2,20);
document.addEventListener("keydown", e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);
function bindBtn(id, key){
  let el = document.getElementById(id);
  el.addEventListener("touchstart", e=>{ e.preventDefault(); keys[key]=true; });
  el.addEventListener("touchend", e=>{ e.preventDefault(); keys[key]=false; });
  el.addEventListener("mousedown", ()=>{ keys[key]=true; });
  el.addEventListener("mouseup", ()=>{ keys[key]=false; });
}
bindBtn("upBtn","w"); bindBtn("downBtn","s"); bindBtn("leftBtn","a"); bindBtn("rightBtn","d");
let camBtn = document.getElementById("camBtn");
camBtn.addEventListener("click", ()=>{
  freeCam = !freeCam;
  if(freeCam){
    camBtn.classList.add("active");
    camBtn.innerText="🚗 CAR CAM";
    camTarget.copy(car.position); camTarget.y=2;
    camYaw = angle; 
    document.getElementById("msg").innerText="📷 FREE CAM ON! Screen drag karke ghumao";
  } else {
    camBtn.classList.remove("active");
    camBtn.innerText="📷 FREE CAM";
    document.getElementById("msg").innerText="🚗 Car Cam wapas!";
  }
});
document.getElementById("resetBtn").addEventListener("click", ()=>{ location.reload(); });
let dragging=false, lastX=0, lastY=0;
renderer.domElement.addEventListener("touchstart", e=>{
  if(freeCam && e.touches.length==1){ dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; }
}, {passive:true});
renderer.domElement.addEventListener("touchmove", e=>{
  if(freeCam && dragging && e.touches.length==1){
    let dx = e.touches[0].clientX - lastX;
    let dy = e.touches[0].clientY - lastY;
    camYaw -= dx * 0.01;
    camPitch = Math.max(0.05, Math.min(1.4, camPitch + dy * 0.01));
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
  }
}, {passive:true});
renderer.domElement.addEventListener("touchend", ()=>{ dragging=false; });
renderer.domElement.addEventListener("mousedown", e=>{ if(freeCam){ dragging=true; lastX=e.clientX; lastY=e.clientY; }});
window.addEventListener("mousemove", e=>{
  if(freeCam && dragging){
    camYaw -= (e.clientX-lastX)*0.01;
    camPitch = Math.max(0.05, Math.min(1.4, camPitch + (e.clientY-lastY)*0.01));
    lastX=e.clientX; lastY=e.clientY;
  }
});
window.addEventListener("mouseup", ()=>{ dragging=false; });
window.addEventListener("wheel", e=>{ if(freeCam){ camDist = Math.max(5, Math.min(40, camDist + e.deltaY*0.02)); }});
setInterval(()=>{
  if(gameOver) return;
  timeLeft--; document.getElementById("time").innerText=timeLeft;
  if(timeLeft<=0){ gameOver=true; document.getElementById("msg").innerText="⏰ TIME UP! Score: "+score+" / 8"; }
},1000);
function chase(police, spd){
  let dx = car.position.x - police.position.x;
  let dz = car.position.z - police.position.z;
  let dist = Math.sqrt(dx*dx+dz*dz);
  if(dist>0.1){ police.position.x += (dx/dist)*spd; police.position.z += (dz/dist)*spd; }
  police.lookAt(car.position); police.rotation.y += Math.PI;
  return dist;
}
function animate(){
  requestAnimationFrame(animate);
  if(!gameOver){
    if(keys["w"]) speed = Math.min(speed+0.02, 0.65);
    if(keys["s"]) speed = Math.max(speed-0.02, -0.3);
    if(keys["a"]) angle += 0.04;
    if(keys["d"]) angle -= 0.04;
    if(!keys["w"] && !keys["s"]) speed *= 0.97;
    car.rotation.y = angle;
    car.position.x -= Math.sin(angle)*speed;
    car.position.z -= Math.cos(angle)*speed;
    car.position.x = Math.max(-70, Math.min(70, car.position.x));
    car.position.z = Math.max(-70, Math.min(70, car.position.z));
    traffics.forEach(t=>{
      t.car.position.x += t.dir * t.speed;
      if(t.car.position.x>60) t.dir=-1;
      if(t.car.position.x<-60) t.dir=1;
      if(Math.abs(t.car.position.x-car.position.x)<2.5 && Math.abs(t.car.position.z-car.position.z)<2.5){ speed = -0.2; }
    });
    let d1 = chase(police1, 0.20);
    let d2 = chase(police2, 0.18);
    if(d1<3 || d2<3){ gameOver=true; document.getElementById("msg").innerText="🚔 PAKDE GAYE! Refresh karke fir try kar!"; }
    if(freeCam){
      camTarget.lerp(car.position, 0.05); camTarget.y=2;
      let cx = camTarget.x + Math.sin(camYaw)*Math.cos(camPitch)*camDist;
      let cz = camTarget.z + Math.cos(camYaw)*Math.cos(camPitch)*camDist;
      let cy = camTarget.y + Math.sin(camPitch)*camDist;
      camera.position.set(cx, cy, cz);
      camera.lookAt(camTarget);
    } else {
      camera.position.set(car.position.x + Math.sin(angle)*10, 10, car.position.z + Math.cos(angle)*10);
      camera.lookAt(car.position);
    }
    coins.forEach((c,i)=>{
      c.rotation.z += 0.05;
      if(Math.abs(c.position.x-car.position.x)<2 && Math.abs(c.position.z-car.position.z)<2){
        scene.remove(c); coins.splice(i,1); score++;
        document.getElementById("score").innerText=score;
        if(score==8){ gameOver=true; document.getElementById("msg").innerText="🏆 LEVEL 2 CLEAR! Tu LEGEND hai!"; }
      }
    });
  }
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
